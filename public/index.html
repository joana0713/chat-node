<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Advanced Chat</title>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-100 via-purple-100 to-pink-100 h-screen flex">

<!-- LEFT ROOM BAR -->
<div class="w-64 bg-white shadow-xl p-4 flex flex-col">
  <h2 class="font-bold text-purple-600 mb-3">Rooms</h2>

  <div class="flex gap-2 mb-3">
    <input id="roomInput" placeholder="Room name"
      class="border px-2 py-1 rounded w-full"/>
    <button onclick="createRoom()"
      class="bg-purple-500 text-white px-3 rounded">+</button>
  </div>

  <div id="roomList" class="space-y-2 overflow-y-auto flex-1"></div>
</div>

<!-- MAIN CHAT -->
<div class="flex-1 flex flex-col">

  <!-- HEADER -->
  <div class="bg-white shadow-md p-4 flex justify-between items-center">
    <div>
      <input id="nickname" placeholder="Nickname"
        class="border rounded px-2 py-1"/>
      <button onclick="joinRoom()"
        class="bg-blue-500 text-white px-4 py-1 rounded ml-2">
        Join
      </button>
    </div>

    <button onclick="toggleHistory()"
      class="bg-pink-500 text-white px-4 py-1 rounded">
      History
    </button>
  </div>

  <!-- CHAT AREA -->
  <div id="chatContainer"
    class="flex-1 overflow-y-auto p-6 space-y-4">
  </div>

  <!-- INPUT -->
  <div class="bg-white p-4 flex gap-2 items-center">
    <input type="file" id="imageInput" class="hidden" accept="image/*"/>

    <button onclick="document.getElementById('imageInput').click()"
      class="bg-yellow-400 px-3 py-2 rounded">
      📷
    </button>

    <input id="messageInput"
      class="flex-1 border rounded px-4 py-2"
      placeholder="Message..." />

    <button onclick="sendMessage()"
      class="bg-blue-600 text-white px-6 py-2 rounded-lg">
      Send
    </button>
  </div>

</div>

<!-- RIGHT HISTORY -->
<div id="historyBar"
  class="w-72 bg-white shadow-xl p-4 hidden flex-col">
  <h2 class="font-bold text-pink-600 mb-3">History</h2>
  <div id="historyList" class="space-y-2 overflow-y-auto flex-1"></div>
</div>

<script>
const socket = io();
let currentRoom = "";
let currentUser = "";
let historyMessages = [];

function createRoom() {
  const room = document.getElementById("roomInput").value.trim();
  if (!room) return;
  socket.emit("createRoom", room);
}

socket.on("roomList", (rooms) => {
  const list = document.getElementById("roomList");
  list.innerHTML = "";
  rooms.forEach(r => {
    const div = document.createElement("div");
    div.className = "p-2 bg-purple-100 rounded cursor-pointer";
    div.innerText = r;
    div.onclick = () => {
      currentRoom = r;
      joinRoom();
    };
    list.appendChild(div);
  });
});

function joinRoom() {
  const nickname = document.getElementById("nickname").value.trim();
  if (!nickname || !currentRoom) return alert("Enter nickname & select room");

  currentUser = nickname;
  socket.emit("joinRoom", { room: currentRoom, nickname });
}

socket.on("chatHistory", (msgs) => {
  historyMessages = msgs;
  renderAllMessages();
  renderHistory();
});

function sendMessage() {
  const text = document.getElementById("messageInput").value.trim();
  const imageFile = document.getElementById("imageInput").files[0];

  if (!text && !imageFile) return;

  if (imageFile) {
    const reader = new FileReader();
    reader.onload = function(e) {
      socket.emit("chatMessage", { text, image: e.target.result });
    };
    reader.readAsDataURL(imageFile);
    document.getElementById("imageInput").value = "";
  } else {
    socket.emit("chatMessage", { text });
  }

  document.getElementById("messageInput").value = "";
}

socket.on("chatMessage", (msg) => {
  historyMessages.push(msg);
  renderMessage(msg);
  renderHistory();
});

socket.on("messageDeleted", (id) => {
  historyMessages = historyMessages.filter(m => m.id !== id);
  renderAllMessages();
  renderHistory();
});

function renderAllMessages() {
  const container = document.getElementById("chatContainer");
  container.innerHTML = "";
  historyMessages.forEach(m => renderMessage(m));
}

function renderMessage(msg) {
  const container = document.getElementById("chatContainer");
  const isMe = msg.user === currentUser;

  const div = document.createElement("div");
  div.className = `flex gap-2 items-end ${isMe ? "justify-end" : ""}`;

  div.innerHTML = `
    ${!isMe ? `<img src="https://ui-avatars.com/api/?name=${msg.user}"
      class="w-10 h-10 rounded-full"/>` : ""}

    <div>
      <div class="text-xs ${isMe ? "text-right" : ""}">${msg.user}</div>

      <div class="px-4 py-2 rounded-2xl shadow
        ${isMe ? "bg-blue-500 text-white rounded-br-none"
               : "bg-white rounded-bl-none"}">

        ${msg.text || ""}
        ${msg.image ? `<img src="${msg.image}" class="mt-2 rounded-lg max-w-xs"/>` : ""}
      </div>

      <div class="text-[10px] text-gray-400 ${isMe ? "text-right" : ""}">
        ${msg.time}
      </div>
    </div>

    ${isMe ? `<button onclick="deleteMessage('${msg.id}')"
      class="text-red-500 text-xs">🗑</button>` : ""}
  `;

  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function deleteMessage(id) {
  socket.emit("deleteMessage", id);
}

function toggleHistory() {
  const bar = document.getElementById("historyBar");
  bar.classList.toggle("hidden");
}

function renderHistory() {
  const list = document.getElementById("historyList");
  list.innerHTML = "";

  historyMessages.forEach(m => {
    const div = document.createElement("div");
    div.className = "p-2 bg-pink-100 rounded text-sm cursor-pointer";
    div.innerText = m.text || "📷 Image";
    div.onclick = () => {
      document.getElementById("chatContainer")
        .children[[...historyMessages].indexOf(m)]
        .scrollIntoView({ behavior: "smooth" });
    };
    list.appendChild(div);
  });
}
</script>

</body>
</html>
