<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Chat</title>

<script src="/socket.io/socket.io.js"></script>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.css">

<script src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>

<style>

.custom-scroll::-webkit-scrollbar{
width:6px
}

.custom-scroll::-webkit-scrollbar-thumb{
background:#6366f1;
border-radius:10px
}

.message{
animation:fade 0.2s
}

@keyframes fade{
from{opacity:0;transform:translateY(10px)}
to{opacity:1}
}

</style>

</head>

<body class="bg-gray-100 dark:bg-[#020617] text-gray-800 dark:text-gray-200 h-screen flex">

<!-- LEFT PANEL -->

<div class="w-64 bg-white dark:bg-[#0f172a] border-r border-gray-200 dark:border-gray-800 p-4 flex flex-col">

<h2 class="font-bold mb-3">Rooms</h2>

<div class="flex gap-2 mb-4">

<input id="roomInput"
class="border rounded px-2 py-1 w-full dark:bg-gray-800">

<button onclick="createRoom()"
class="bg-purple-600 text-white px-3 rounded">+</button>

</div>

<div id="roomList" class="space-y-2 flex-1"></div>

<h2 class="font-bold mt-4">Users</h2>

<div id="userList" class="text-sm space-y-1"></div>

</div>

<!-- MAIN -->

<div class="flex-1 flex flex-col">

<!-- HEADER -->

<div class="bg-white dark:bg-[#020617] border-b border-gray-200 dark:border-gray-800 p-4 flex justify-between">

<div>

<input id="nickname"
placeholder="Nickname"
class="border rounded px-2 py-1 dark:bg-gray-800">

<button onclick="joinRoom()"
class="bg-blue-600 text-white px-4 py-1 rounded ml-2">
Join
</button>

</div>

<button onclick="toggleDark()"
class="bg-gray-800 text-white px-3 py-1 rounded">
🌙
</button>

</div>

<!-- CHAT -->

<div id="chatContainer"
class="flex-1 overflow-y-auto p-6 space-y-4 custom-scroll
bg-white dark:bg-[#020617]"></div>

<!-- INPUT -->

<div class="bg-white dark:bg-[#020617] border-t border-gray-200 dark:border-gray-800 p-4 flex gap-2 relative">

<input type="file" id="imageInput" class="hidden">

<button onclick="imageInput.click()"
class="bg-yellow-400 px-3 py-2 rounded">📷</button>

<button onclick="toggleEmoji()"
class="bg-pink-500 text-white px-3 py-2 rounded">😊</button>

<input id="messageInput"
class="flex-1 border rounded px-4 py-2 dark:bg-gray-800"
placeholder="Message...">

<button onclick="sendMessage()"
class="bg-blue-600 text-white px-6 py-2 rounded">
Send
</button>

<div id="emojiPanel"
class="absolute bottom-16 left-20 hidden"></div>

</div>

</div>

<script>

const socket=io()

let currentRoom=""
let currentUser=""
let historyMessages=[]

/* ROOM */

function createRoom(){

const room=document.getElementById("roomInput").value.trim()

socket.emit("createRoom",room)

}

socket.on("roomList",(rooms)=>{

const list=document.getElementById("roomList")

list.innerHTML=""

rooms.forEach(r=>{

const div=document.createElement("div")

div.className="p-2 bg-gray-200 dark:bg-gray-700 rounded cursor-pointer"

div.innerText=r

div.onclick=()=>{

currentRoom=r
joinRoom()

}

list.appendChild(div)

})

})

/* JOIN */

function joinRoom(){

const nickname=document.getElementById("nickname").value.trim()

if(!nickname||!currentRoom){
alert("enter nickname & room")
return
}

currentUser=nickname

socket.emit("joinRoom",{room:currentRoom,nickname})

}

socket.on("chatHistory",(msgs)=>{

historyMessages=msgs

renderAll()

})

/* USERS */

socket.on("userList",(users)=>{

const list=document.getElementById("userList")

list.innerHTML=""

users.forEach(u=>{

const div=document.createElement("div")

div.innerText="🟢 "+u

list.appendChild(div)

})

})

/* SEND */

function sendMessage(){

const text=document.getElementById("messageInput").value.trim()

if(!text) return

socket.emit("chatMessage",{text})

messageInput.value=""

}

messageInput.addEventListener("keypress",(e)=>{

if(e.key==="Enter") sendMessage()

})

messageInput.addEventListener("input",()=>{

socket.emit("typing")

})

/* IMAGE */

imageInput.addEventListener("change",function(){

const file=this.files[0]

const reader=new FileReader()

reader.onload=(e)=>{

socket.emit("chatMessage",{image:e.target.result})

}

reader.readAsDataURL(file)

})

/* RECEIVE */

socket.on("chatMessage",(msg)=>{

historyMessages.push(msg)

renderMessage(msg)

})

socket.on("messageDeleted",(id)=>{

historyMessages=historyMessages.filter(m=>m.id!==id)

renderAll()

})

/* RENDER */

function renderAll(){

chatContainer.innerHTML=""

historyMessages.forEach(m=>renderMessage(m))

}

function renderMessage(msg){

if(msg.system){

const sys=document.createElement("div")

sys.className="text-center text-gray-400"

sys.innerText=msg.text

chatContainer.appendChild(sys)

return

}

const isMe=msg.user===currentUser

const div=document.createElement("div")

div.className=`flex ${isMe?"justify-end":""} gap-2 message`

div.innerHTML=`

<div>

<div class="text-xs">${msg.user}</div>

<div class="px-4 py-2 rounded-xl shadow
${isMe?"bg-blue-600 text-white":"bg-gray-200 dark:bg-gray-700"}">

${msg.text||""}

${msg.image?`<img src="${msg.image}" class="mt-2 rounded max-w-xs">`:""}

</div>

<div class="text-[10px] text-gray-400">${msg.time}</div>

</div>

${isMe?`<button onclick="deleteMessage('${msg.id}')">🗑</button>`:""}

`

chatContainer.appendChild(div)

chatContainer.scrollTo({
top:chatContainer.scrollHeight,
behavior:"smooth"
})

}

function deleteMessage(id){

socket.emit("deleteMessage",id)

}

/* EMOJI */

function toggleEmoji(){

const panel=document.getElementById("emojiPanel")

panel.classList.toggle("hidden")

if(panel.innerHTML===""){

const picker=new EmojiMart.Picker({

onEmojiSelect:(emoji)=>{

messageInput.value+=emoji.native

}

})

panel.appendChild(picker)

}

}

/* DARK */

function toggleDark(){

document.documentElement.classList.toggle("dark")

}

</script>

</body>
</html>
