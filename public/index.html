<!DOCTYPE html>
<html>
<head>
  <title>Modern Chat</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="w-[1100px] h-[700px] bg-white rounded-2xl shadow-2xl flex overflow-hidden">

  <!-- Sidebar -->
  <div class="w-1/4 bg-gray-900 text-white flex flex-col">
    <div class="p-4 text-lg font-bold border-b border-gray-700">
      💬 Rooms
    </div>
    <div id="roomList" class="flex-1 overflow-y-auto"></div>
  </div>

  <!-- Chat Area -->
  <div class="flex-1 flex flex-col">

    <!-- Header -->
    <div class="bg-blue-600 text-white p-4 text-xl font-semibold">
      Realtime Chat
    </div>

    <!-- Join -->
    <div id="joinSection" class="flex gap-2 p-4 border-b">
      <input id="username" placeholder="Your name"
        class="flex-1 border p-2 rounded-lg"/>
      <input id="room" placeholder="Room name"
        class="flex-1 border p-2 rounded-lg"/>
      <button onclick="joinRoom()"
        class="bg-blue-600 text-white px-4 rounded-lg hover:bg-blue-700">
        Join
      </button>
    </div>

    <!-- Messages -->
    <div id="messages"
      class="flex-1 p-6 overflow-y-auto space-y-4 bg-gray-50">
    </div>

    <!-- Input -->
    <div class="p-4 border-t flex gap-2 items-center">
      <input type="file" id="imageInput" class="hidden" onchange="sendImage()" />
      <button onclick="document.getElementById('imageInput').click()"
        class="text-2xl hover:scale-110 transition">
        📷
      </button>

      <input id="messageInput"
        class="flex-1 border p-3 rounded-xl"
        placeholder="Type message..."
        onkeydown="if(event.key==='Enter') sendMessage()" />

      <button onclick="sendMessage()"
        class="bg-blue-600 text-white px-6 rounded-xl hover:bg-blue-700">
        Send
      </button>
    </div>

  </div>
</div>

<script>
const socket = io();
let currentUser = "";
let currentRoom = "";

function joinRoom() {
  const username = document.getElementById("username").value;
  const room = document.getElementById("room").value;

  if (!username || !room) return alert("Fill all fields");

  currentUser = username;
  currentRoom = room;

  socket.emit("joinRoom", { username, room });
  document.getElementById("joinSection").style.display = "none";
}

function sendMessage() {
  const input = document.getElementById("messageInput");
  if (!input.value) return;

  socket.emit("sendMessage", {
    text: input.value
  });

  input.value = "";
}

function sendImage() {
  const fileInput = document.getElementById("imageInput");
  const file = fileInput.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    socket.emit("sendMessage", {
      text: null,
      image: e.target.result
    });
  };
  reader.readAsDataURL(file);
  fileInput.value = "";
}

function renderMessage(data) {
  const messages = document.getElementById("messages");
  const isMine = data.user === currentUser;

  const wrapper = document.createElement("div");
  wrapper.id = "msg-" + data.id;
  wrapper.className = `flex items-end gap-2 ${isMine ? "justify-end" : ""}`;

  wrapper.innerHTML = `
    ${!isMine ? `
      <div class="w-10 h-10 rounded-full bg-blue-400 text-white flex items-center justify-center font-bold">
        ${data.user.charAt(0).toUpperCase()}
      </div>` : ""}

    <div class="max-w-[60%]">
      <div class="${isMine ? "bg-blue-600 text-white" : "bg-white border"} 
        p-3 rounded-2xl shadow-md">

        ${data.text ? `<div>${data.text}</div>` : ""}
        ${data.image ? `<img src="${data.image}" class="mt-2 rounded-lg max-h-60 cursor-pointer"/>` : ""}

        <div class="text-xs mt-1 opacity-70 flex justify-between">
          <span>${data.time}</span>
          ${isMine ? `
            <button onclick="deleteMessage(${data.id})"
              class="text-red-400 hover:text-red-600">
              🗑
            </button>` : ""}
        </div>
      </div>
    </div>

    ${isMine ? `
      <div class="w-10 h-10 rounded-full bg-green-500 text-white flex items-center justify-center font-bold">
        ${data.user.charAt(0).toUpperCase()}
      </div>` : ""}
  `;

  messages.appendChild(wrapper);
  messages.scrollTop = messages.scrollHeight;
}

function deleteMessage(id) {
  socket.emit("deleteMessage", id);
}

socket.on("receiveMessage", renderMessage);

socket.on("messageDeleted", (id) => {
  const el = document.getElementById("msg-" + id);
  if (el) el.remove();
});

socket.on("roomMessages", (msgs) => {
  document.getElementById("messages").innerHTML = "";
  msgs.forEach(renderMessage);
});

socket.on("updateRoomList", (rooms) => {
  const list = document.getElementById("roomList");
  list.innerHTML = "";

  rooms.forEach(r => {
    const div = document.createElement("div");
    div.className = "p-3 hover:bg-gray-700 cursor-pointer";
    div.innerText = r;
    div.onclick = () => {
      document.getElementById("room").value = r;
    };
    list.appendChild(div);
  });
});
</script>

</body>
</html>
