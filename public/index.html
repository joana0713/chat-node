<!DOCTYPE html>
<html>
<head>
  <title>Modern Chat</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="w-[900px] h-[650px] bg-white rounded-2xl shadow-2xl flex flex-col overflow-hidden">

  <!-- Header -->
  <div class="bg-blue-600 text-white p-4 text-xl font-semibold">
    💬 Realtime Chat Room
  </div>

  <!-- Join Section -->
  <div id="joinSection" class="flex gap-2 p-4 border-b">
    <input id="username" placeholder="Your name"
      class="flex-1 border p-2 rounded-lg"/>
    <input id="room" placeholder="Room name"
      class="flex-1 border p-2 rounded-lg"/>
    <button onclick="joinRoom()"
      class="bg-blue-600 text-white px-4 rounded-lg hover:bg-blue-700">
      Join
    </button>
  </div>

  <!-- Messages -->
  <div id="messages"
    class="flex-1 p-6 overflow-y-auto space-y-4 bg-gray-50">
  </div>

  <!-- Input -->
  <div class="p-4 border-t flex gap-2">
    <input id="messageInput"
      class="flex-1 border p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400"
      placeholder="Type a message..."
      onkeydown="if(event.key==='Enter') sendMessage()" />
    <button onclick="sendMessage()"
      class="bg-blue-600 text-white px-6 rounded-xl hover:bg-blue-700">
      Send
    </button>
  </div>

</div>

<script>
const socket = io();
let currentUser = "";
let currentRoom = "";

function joinRoom() {
  const username = document.getElementById("username").value;
  const room = document.getElementById("room").value;

  if (!username || !room) {
    alert("Enter username and room");
    return;
  }

  currentUser = username;
  currentRoom = room;

  socket.emit("joinRoom", { username, room });
  document.getElementById("joinSection").style.display = "none";
}

function sendMessage() {
  const input = document.getElementById("messageInput");
  const message = input.value;

  if (!message) return;

  socket.emit("sendMessage", message);
  input.value = "";
}

socket.on("receiveMessage", (data) => {
  const messages = document.getElementById("messages");

  const isMine = data.user === currentUser;

  const wrapper = document.createElement("div");
  wrapper.id = "msg-" + data.id;
  wrapper.className = `flex items-end gap-2 ${isMine ? "justify-end" : ""}`;

  wrapper.innerHTML = `
    ${!isMine ? `
      <div class="w-10 h-10 rounded-full bg-blue-400 text-white flex items-center justify-center font-bold">
        ${data.user.charAt(0).toUpperCase()}
      </div>` : ""}

    <div class="max-w-[60%]">
      <div class="${isMine ? 
        "bg-blue-600 text-white" : 
        "bg-white border"} 
        p-3 rounded-2xl shadow-md transition transform hover:scale-[1.02]">

        <div class="text-sm">${data.text}</div>
        
        <div class="text-xs mt-1 opacity-70 flex justify-between items-center">
          <span>${data.time}</span>
          ${isMine ? `
            <span id="read-${data.id}" class="ml-2">
              ✔
            </span>
            <button onclick="deleteMessage(${data.id})"
              class="ml-2 text-red-400 hover:text-red-600 text-sm">
              🗑
            </button>
          ` : ""}
        </div>
      </div>
    </div>

    ${isMine ? `
      <div class="w-10 h-10 rounded-full bg-green-500 text-white flex items-center justify-center font-bold">
        ${data.user.charAt(0).toUpperCase()}
      </div>` : ""}
  `;

  messages.appendChild(wrapper);
  messages.scrollTop = messages.scrollHeight;

  if (!isMine) {
    socket.emit("messageRead", data.id);
  }
});

socket.on("messageDeleted", (id) => {
  const msg = document.getElementById("msg-" + id);
  if (msg) msg.remove();
});

socket.on("messageReadUpdate", (id) => {
  const el = document.getElementById("read-" + id);
  if (el) el.innerText = "✔✔";
});

socket.on("systemMessage", (msg) => {
  const messages = document.getElementById("messages");

  const div = document.createElement("div");
  div.className = "text-center text-sm text-gray-400";
  div.innerText = msg;

  messages.appendChild(div);
});
</script>

</body>
</html>
