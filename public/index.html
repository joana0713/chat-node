<!DOCTYPE html>
<html>
<head>
  <title>Advanced Chat</title>
  <style>
    body { margin:0; font-family:Arial; display:flex; height:100vh; }
    #main { flex:1; display:flex; flex-direction:column; }
    #messages { flex:1; padding:10px; overflow-y:auto; }
    .msg { padding:6px; margin-bottom:5px; border-bottom:1px solid #eee; }
    .actions span {
      cursor:pointer;
      font-size:12px;
      margin-left:8px;
      color:blue;
    }
    #inputArea { display:flex; padding:10px; border-top:1px solid #ddd; }
    #messageInput { flex:1; padding:8px; }
    #sendBtn { padding:8px 12px; font-size:12px; }

    #historyBar {
      width:0;
      background:#f4f4f4;
      overflow-y:auto;
      transition:0.3s;
      border-left:1px solid #ccc;
    }
    #historyBar.open { width:250px; }

    #historyBar h3 { padding:10px; margin:0; background:#ddd; }
    #historyPanel { padding:10px; }

    .history-item {
      cursor:pointer;
      font-size:12px;
      margin-bottom:6px;
    }

    #topBar {
      padding:10px;
      background:#222;
      color:white;
      display:flex;
      justify-content:space-between;
    }

    button { cursor:pointer; }
  </style>
</head>
<body>

<div id="main">

  <div id="topBar">
    <div>Room Chat</div>
    <div>
      <button onclick="toggleHistory()">History</button>
      <button onclick="clearHistory()">Clear History UI</button>
    </div>
  </div>

  <div id="messages"></div>

  <div id="inputArea">
    <input id="messageInput" placeholder="Type message..." />
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>

</div>

<div id="historyBar">
  <h3>History</h3>
  <div id="historyPanel"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const room = "global";
  socket.emit("joinRoom", room);

  const messagesDiv = document.getElementById("messages");
  const historyPanel = document.getElementById("historyPanel");

  function toggleHistory() {
    document.getElementById("historyBar").classList.toggle("open");
  }

  function clearHistory() {
    historyPanel.innerHTML = "";
  }

  function sendMessage() {
    const input = document.getElementById("messageInput");
    const message = input.value.trim();
    if (!message) return;

    socket.emit("chatMessage", { room, message });
    input.value = "";
  }

  function addMessageToUI(msgObj) {
    const div = document.createElement("div");
    div.className = "msg";
    div.id = "msg-" + msgObj.id;

    div.innerHTML = `
      <span class="text">${msgObj.text}</span>
      <span class="actions">
        <span onclick="editMessage('${msgObj.id}')">Edit</span>
        <span onclick="deleteMessage('${msgObj.id}')">Delete</span>
      </span>
    `;

    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function addToHistory(msgObj) {
    const div = document.createElement("div");
    div.className = "history-item";
    div.id = "history-" + msgObj.id;
    div.innerText = msgObj.text;

    div.onclick = () => {
      document.getElementById("msg-" + msgObj.id)
        ?.scrollIntoView({ behavior: "smooth" });
    };

    historyPanel.appendChild(div);
  }

  function editMessage(id) {
    const newText = prompt("Edit message:");
    if (!newText) return;
    socket.emit("editMessage", { room, id, newText });
  }

  function deleteMessage(id) {
    if (!confirm("Delete this message?")) return;
    socket.emit("deleteMessage", { room, id });
  }

  socket.on("previousMessages", (msgs) => {
    msgs.forEach(msg => {
      addMessageToUI(msg);
      addToHistory(msg);
    });
  });

  socket.on("message", (msgObj) => {
    addMessageToUI(msgObj);
    addToHistory(msgObj);
  });

  socket.on("messageEdited", (msgObj) => {
    const msgDiv = document.getElementById("msg-" + msgObj.id);
    const historyDiv = document.getElementById("history-" + msgObj.id);

    if (msgDiv) {
      msgDiv.querySelector(".text").innerText = msgObj.text;
    }

    if (historyDiv) {
      historyDiv.innerText = msgObj.text;
    }
  });

  socket.on("messageDeleted", (id) => {
    const msgDiv = document.getElementById("msg-" + id);
    const historyDiv = document.getElementById("history-" + id);

    if (msgDiv) msgDiv.remove();
    if (historyDiv) historyDiv.remove();
  });
</script>

</body>
</html>
