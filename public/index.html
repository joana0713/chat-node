<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Modern Chat</title>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.css">
<script src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>

<style>

body.dark{
background:#020617;
color:#e2e8f0;
}

.chat-dark{
background:#020617;
}

.message{
animation:fade .2s;
}

@keyframes fade{
from{opacity:0;transform:translateY(10px)}
to{opacity:1}
}

.custom-scroll::-webkit-scrollbar{
width:6px
}

.custom-scroll::-webkit-scrollbar-thumb{
background:#6366f1;
border-radius:10px
}

</style>

</head>

<body class="h-screen flex bg-gray-100">

<!-- ROOM PANEL -->

<div class="w-64 bg-white border-r p-4 flex flex-col">

<h2 class="font-bold mb-3">Rooms</h2>

<div class="flex gap-2 mb-4">

<input id="roomInput" class="border rounded px-2 py-1 w-full">

<button onclick="createRoom()" class="bg-purple-600 text-white px-3 rounded">
+
</button>

</div>

<div id="roomList" class="space-y-2 flex-1"></div>

<h2 class="font-bold mt-4">Users</h2>

<div id="userList" class="text-sm space-y-1"></div>

</div>

<!-- MAIN -->

<div class="flex-1 flex flex-col">

<!-- HEADER -->

<div class="bg-white border-b p-4 flex justify-between">

<div>

<input id="nickname" placeholder="Nickname"
class="border rounded px-2 py-1">

<button onclick="joinRoom()"
class="bg-blue-600 text-white px-4 py-1 rounded ml-2">
Join
</button>

</div>

<div class="flex gap-2">

<button onclick="toggleDark()"
class="bg-gray-800 text-white px-3 py-1 rounded">
🌙
</button>

<button onclick="toggleGif()"
class="bg-pink-500 text-white px-3 py-1 rounded">
GIF
</button>

</div>

</div>

<!-- CHAT -->

<div id="chatContainer"
class="flex-1 overflow-y-auto p-6 space-y-4 custom-scroll"></div>

<!-- SUGGESTION -->

<div id="suggestions"
class="px-6 text-sm text-gray-500"></div>

<!-- INPUT -->

<div class="bg-white border-t p-4 flex gap-2 relative">

<input type="file" id="imageInput" class="hidden">

<button onclick="imageInput.click()"
class="bg-yellow-400 px-3 py-2 rounded">
📷
</button>

<button onclick="toggleEmoji()"
class="bg-pink-500 text-white px-3 py-2 rounded">
😊
</button>

<input id="messageInput"
class="flex-1 border rounded px-4 py-2"
placeholder="Message...">

<button onclick="sendMessage()"
class="bg-blue-600 text-white px-6 py-2 rounded">
Send
</button>

<div id="emojiPanel"
class="absolute bottom-16 left-10 hidden"></div>

</div>

<!-- GIF SEARCH -->

<div id="gifPanel"
class="hidden absolute bottom-20 left-72 bg-white p-4 shadow-xl rounded w-96">

<input id="gifSearch"
placeholder="Search GIF..."
class="border w-full px-2 py-1 mb-3">

<div id="gifResults"
class="grid grid-cols-3 gap-2"></div>

</div>

</div>

<script>

const socket=io()

let currentRoom=""
let currentUser=""

let historyMessages=[]

/* DARK MODE */

function toggleDark(){

document.body.classList.toggle("dark")

}

/* ROOM */

function createRoom(){

const room=roomInput.value.trim()

socket.emit("createRoom",room)

}

socket.on("roomList",(rooms)=>{

roomList.innerHTML=""

rooms.forEach(r=>{

const div=document.createElement("div")

div.className="p-2 bg-gray-200 rounded cursor-pointer"

div.innerText=r

div.onclick=()=>{

currentRoom=r
joinRoom()

}

roomList.appendChild(div)

})

})

/* JOIN */

function joinRoom(){

const nickname=nickname.value.trim()

if(!nickname||!currentRoom) return

currentUser=nickname

socket.emit("joinRoom",{room:currentRoom,nickname})

}

socket.on("chatHistory",(msgs)=>{

historyMessages=msgs

renderAll()

})

/* USERS */

socket.on("userList",(users)=>{

userList.innerHTML=""

users.forEach(u=>{

const div=document.createElement("div")

div.innerText="🟢 "+u

userList.appendChild(div)

})

})

/* SEND */

function sendMessage(){

const text=messageInput.value.trim()

if(!text) return

socket.emit("chatMessage",{text})

messageInput.value=""

}

messageInput.addEventListener("keypress",(e)=>{

if(e.key==="Enter") sendMessage()

})

/* IMAGE */

imageInput.addEventListener("change",function(){

const file=this.files[0]

const reader=new FileReader()

reader.onload=(e)=>{

socket.emit("chatMessage",{image:e.target.result})

}

reader.readAsDataURL(file)

})

/* GIF SEARCH */

function toggleGif(){

gifPanel.classList.toggle("hidden")

}

gifSearch.addEventListener("input",async()=>{

const q=gifSearch.value

if(q.length<2) return

const res=await fetch(
`https://g.tenor.com/v1/search?q=${q}&key=LIVDSRZULELA&limit=9`
)

const data=await res.json()

gifResults.innerHTML=""

data.results.forEach(g=>{

const img=document.createElement("img")

img.src=g.media[0].gif.url

img.className="cursor-pointer rounded"

img.onclick=()=>{

socket.emit("chatMessage",{gif:g.media[0].gif.url})

gifPanel.classList.add("hidden")

}

gifResults.appendChild(img)

})

})

/* RECEIVE */

socket.on("chatMessage",(msg)=>{

historyMessages.push(msg)

renderMessage(msg)

})

/* RENDER */

function renderAll(){

chatContainer.innerHTML=""

historyMessages.forEach(m=>renderMessage(m))

}

function renderMessage(msg){

if(msg.system){

const sys=document.createElement("div")

sys.className="text-center text-gray-400"

sys.innerText=msg.text

chatContainer.appendChild(sys)

return

}

const div=document.createElement("div")

div.className="message"

div.innerHTML=`

<div class="text-xs">${msg.user}</div>

<div class="bg-gray-200 px-4 py-2 rounded-xl">

${msg.text||""}

${msg.image?`<img src="${msg.image}" class="mt-2 max-w-xs rounded">`:""}

${msg.gif?`<img src="${msg.gif}" class="mt-2 max-w-xs rounded">`:""}

</div>

<div class="text-[10px] text-gray-400">${msg.time}</div>

`

chatContainer.appendChild(div)

chatContainer.scrollTop=chatContainer.scrollHeight

}

/* EMOJI */

function toggleEmoji(){

emojiPanel.classList.toggle("hidden")

if(emojiPanel.innerHTML===""){

const picker=new EmojiMart.Picker({

onEmojiSelect:(emoji)=>{

messageInput.value+=emoji.native

}

})

emojiPanel.appendChild(picker)

}

}

/* MESSAGE SUGGESTIONS */

const suggestionsList=[
"Hello 👋",
"How are you?",
"Good morning ☀️",
"Nice to meet you!",
"Let's start 🚀"
]

messageInput.addEventListener("input",()=>{

const text=messageInput.value.toLowerCase()

const match=suggestionsList.filter(s=>s.toLowerCase().includes(text))

suggestions.innerHTML=match.map(m=>
`<span class="cursor-pointer mr-2">${m}</span>`
).join("")

})

</script>

</body>
</html>
